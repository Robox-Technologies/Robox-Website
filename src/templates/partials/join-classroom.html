<%~ include('./card_templates/card_templates.html') %>
<div class="join-classroom-dialog">
        <div class="join-classroom-container">
            <div class="pill-slider">
            <button id="class-code-button" class="pill-button">
                <i class="fa-solid fa-hashtag" style="padding-right: 4px;"></i> Join via Class Code
            </button>
            <button id="my-invites-button" class="pill-button">
                <i class="fa-solid fa-envelope" style="padding-right: 4px;"></i> My Classroom Invites
            </button>
            </div>

        <div class="input-container">
            <div class="classcode-input">
                <input type="text" class="digit-input" maxlength="1" data-index="0" inputmode="numeric" pattern="[0-9]*">
                <input type="text" class="digit-input" maxlength="1" data-index="1" inputmode="numeric" pattern="[0-9]*">
                <input type="text" class="digit-input" maxlength="1" data-index="2" inputmode="numeric" pattern="[0-9]*">
                <input type="text" class="digit-input" maxlength="1" data-index="3" inputmode="numeric" pattern="[0-9]*">
                <input type="text" class="digit-input" maxlength="1" data-index="4" inputmode="numeric" pattern="[0-9]*">
                <input type="text" class="digit-input" maxlength="1" data-index="5" inputmode="numeric" pattern="[0-9]*">
                <input type="text" class="digit-input" maxlength="1" data-index="6" inputmode="numeric" pattern="[0-9]*">
                <input type="text" class="digit-input" maxlength="1" data-index="7" inputmode="numeric" pattern="[0-9]*">
            </div>
            <input type="hidden" id="classroom-code-value" name="classroom-code" value="">
            <p id="classroom-code-error-msg" class="error" style="display: none;"></p>
        </div>

        <button id="scan-qr-button" class="action-button">
            Scan QR Code <i class="fa-solid fa-qrcode"></i>
        </button>

        <button id="join-classroom-button" class="action-button" style="background-color: #91CC31;">
            Join Classroom <i class="fa-solid fa-arrow-right"></i>
        </button>
    </div>
    <div class="my-classrooms-container">
        <h2>
            My Classrooms
        </h2>
        <div class="my-classrooms-list">
            <div class="classroom-item card">
                <div class="classroom-avatar">
                    <img src="https://api.dicebear.com/9.x/bottts/svg?seed=Felix" alt="Classroom Avatar">
                </div>
                <div class="classroom-titles">
                    <h3 class="classroom-name">Year 8 DT</h3>
                    <h4 class="course-code">06DT-CRTECH01</h4>
                </div>
                <div class="classroom-info pending">
                    Pending Request
                </div>
            </div>
        </div>
    </div>
</div>
<script src="@root/join-classroom.ts"></script>
